name: Unit Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  unit_tests:
    timeout-minutes: 60
    name: Unit Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test

      - uses: actions/upload-artifact@v4
        if: ${{ env.ACTIONS_RUNTIME_TOKEN != '' && !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
